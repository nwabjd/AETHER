name: Deploy AETHER WebGPU to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/webgpu/**'
      - '.github/workflows/deploy-webgpu.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/webgpu/package-lock.json

      - name: Install dependencies
        working-directory: apps/webgpu
        run: npm ci

      - name: Build
        working-directory: apps/webgpu
        run: npx vite build --base=/AETHER/
        env:
          BASE_PATH: /AETHER/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/webgpu/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
